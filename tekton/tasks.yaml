---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: echo
spec:
  description: This task will echo the message.
  params:
    - name: message
      description: The message to echo
      type: string
  steps:
    - name: echo-message
      image: alpine:3
      command: [/bin/echo]
      args: ["$(params.message)"]
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up a workspace by deleting all of the files.
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        # Delete any existing contents of the directory if it exists.
        #
        # We don't just "rm -rf ${WORKSPACE_SOURCE_PATH}" because ${WORKSPACE_SOURCE_PATH} might be "/"
        # or the root of a mounted volume.
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          # Delete non-hidden files and directories
          rm -rf "${WORKSPACE_SOURCE_PATH:?}"/*
          # Delete files and directories starting with . but excluding ..
          rm -rf "${WORKSPACE_SOURCE_PATH}"/.[!.]*
          # Delete files and directories starting with .. plus any other character
          rm -rf "${WORKSPACE_SOURCE_PATH}"/..?*
        fi


---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: Run the accounts service unit tests against an isolated SQLite database.
  workspaces:
    - name: source
  steps:
    - name: nosetests
      image: python:3.9-slim
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: "sqlite:///:memory:"
      script: |
        #!/bin/sh
        set -eu
        python -m pip install --quiet -r requirements.txt
        nosetests --with-xunit --xunit-file=/tmp/capstone-nose.xml
        coverage report -m

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: deploy-accounts
spec:
  params:
    - name: image
      type: string
  workspaces:
    - name: source
  steps:
    - name: apply
      image: quay.io/openshift/origin-cli:4.7
      workingDir: $(workspaces.source.path)
      env:
        - name: ACCOUNTS_IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        case "$ACCOUNTS_IMAGE" in
          ""|*[!a-zA-Z0-9./:_@-]*)
            echo "The image reference contains unsupported characters." >&2
            exit 1
            ;;
        esac
        sed "s|IMAGE_NAME_HERE|$ACCOUNTS_IMAGE|g" deploy/deployment.yaml > /tmp/accounts-deployment.yaml
        oc apply -f /tmp/accounts-deployment.yaml -f deploy/service.yaml
        oc rollout status deployment/accounts --timeout=180s
        oc get deployment,pods,replicasets,services -l app=accounts
